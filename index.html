<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>to hyy 🎄</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  .txt{position:fixed;left:7vw;top:34%;pointer-events:none;color:#fff;
       font-family:"Monotype Corsiva","Segoe Script","Brush Script MT",Georgia,serif;
       font-style:italic;text-shadow:0 0 24px rgba(255,170,215,.55),0 0 4px rgba(255,255,255,.35)}
  .txt h1{margin:0;font-weight:400;font-size:clamp(30px,4.4vw,66px);line-height:1.1}
  .txt p{margin:.4em 0 0;font-size:clamp(13px,1.45vw,22px);opacity:.72;letter-spacing:.04em}
  .hint{position:fixed;left:7vw;bottom:7vh;pointer-events:none;color:#fff;opacity:0;
        font:400 13px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.08em;
        animation:hint 7s ease-in-out forwards}
  @keyframes hint{10%{opacity:.42}70%{opacity:.42}100%{opacity:0}}
  @media (max-width:560px){.txt{top:26%}.hint{bottom:5vh}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="txt"><h1>to hyy</h1><p>Merry Christmas</p></div>
<div class="hint">拖动旋转</div>
<script>
'use strict';
var TAU = Math.PI * 2;
// 相机参数，与 tree.py 一致
var TREE_H = 12.0, PITCH = -0.25, CAM_DIST = 13.0, CAM_HEIGHT = 6.0;

var cvs = document.getElementById('c');
var ctx = cvs.getContext('2d', { alpha: false });
var W = 0, H = 0, img = null, buf = null;

var small = Math.min(screen.width, screen.height) < 700;
var TREE_N  = small ? 20000 : 50000;
var GROUND_N = small ? 2000 : 4000;
var STAR_N   = small ? 700  : 1200;
var HEART_N  = small ? 600  : 1000;

var xs, ys, zs, cr, cg, cb, N = 0;

function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
function gauss(mu, sd) {
  var u = 0, v = 0;
  while (!u) u = Math.random();
  while (!v) v = Math.random();
  return mu + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
}

function build() {
  var X = [], Y = [], Z = [], R = [], G = [], B = [];
  function add(x, y, z, r, g, b) { X.push(x); Y.push(y); Z.push(z); R.push(r); G.push(g); B.push(b); }
  var i, u, h, y, baseR, wave, t, ang, r, mid, g, b;

  // 70% 螺旋灯带，底部密顶部稀
  var loops = 9, spiral = Math.floor(TREE_N * 0.7);
  for (i = 0; i < spiral; i++) {
    u = Math.random();
    h = Math.pow(u, 1.6);
    y = TREE_H * h + 0.2;
    baseR = Math.pow(1 - h, 1.1) * 3.2;
    wave = Math.max(0, Math.sin((h * 5.8 + 0.15) * TAU));
    baseR *= 1 + 0.65 * wave;
    t = u * loops * TAU;
    ang = t + rand(-0.22, 0.22);
    r = baseR * rand(0.85, 1.08);
    mid = Math.max(0.15, 1 - Math.abs(h - 0.55) * 1.5);
    g = Math.min(255, 155 + Math.floor(90 * mid) + randInt(-15, 20));
    b = Math.min(255, 185 + Math.floor(70 * mid) + randInt(-15, 35));
    if (Math.random() < 0.08) { g = 255 - randInt(0, 35); b = Math.min(255, 230 + randInt(0, 25)); }
    add(Math.cos(ang) * r, y, Math.sin(ang) * r, 255, g, b);
  }
  // 30% 随机填充，让轮廓毛茸茸
  for (i = 0; i < TREE_N - spiral; i++) {
    h = Math.pow(Math.random(), 1.9);
    y = TREE_H * h + 0.2 + rand(-0.08, 0.08);
    baseR = Math.pow(1 - h, 1.1) * 4.3;
    wave = Math.max(0, Math.sin((h * 5.8 + 0.15) * TAU));
    baseR *= 1 + 0.65 * wave;
    r = baseR * Math.sqrt(Math.random());
    ang = Math.random() * TAU;
    add(Math.cos(ang) * r + rand(-0.08, 0.08), y, Math.sin(ang) * r + rand(-0.08, 0.08),
        255, randInt(165, 225), randInt(190, 250));
  }
  // 地面光环
  var rings = [4.6, 6.0, 7.4, 8.8, 10.2, 11.4], c;
  for (i = 0; i < GROUND_N; i++) {
    r = gauss(rings[Math.floor(Math.random() * rings.length)], 0.3);
    ang = Math.random() * TAU;
    c = Math.random() < 0.15 ? randInt(235, 255) : randInt(190, 235);
    add(Math.cos(ang) * r, -0.25, Math.sin(ang) * r, c, c, 255);
  }
  // 空中星点
  for (i = 0; i < STAR_N; i++) {
    c = randInt(215, 255);
    add(rand(-18, 18), rand(3, 18), rand(-18, 18), c, c, 255);
  }
  // 树顶 3D 爱心：(x²+y²-1)³ - x²y³ <= 0
  var hx, hy, f, topY = TREE_H + 0.05, dist, fac;
  for (i = 0; i < HEART_N; i++) {
    do {
      hx = rand(-1.3, 1.3); hy = rand(-1.4, 1.4);
      f = Math.pow(hx * hx + hy * hy - 1, 3) - hx * hx * hy * hy * hy;
    } while (f > 0);
    dist = Math.hypot(hx, hy);
    fac = Math.max(0.35, 1.15 - 0.5 * dist);
    add(hx * 0.9 * 0.8, topY + (hy + 1) * 0.9 * 0.5, rand(-0.18, 0.18),
        255, Math.max(120, Math.min(255, Math.floor(130 * fac + 80))),
        Math.max(120, Math.min(255, Math.floor(190 * fac + 70))));
  }

  N = X.length;
  xs = Float32Array.from(X); ys = Float32Array.from(Y); zs = Float32Array.from(Z);
  cr = Uint8Array.from(R); cg = Uint8Array.from(G); cb = Uint8Array.from(B);
}

var flakes = [];
function spawn(f) {
  f[0] = rand(0, W); f[1] = rand(-80, -10);
  f[2] = rand(10, 16); f[3] = rand(30, 45);
  f[4] = (H + 80 - f[1]) / f[3]; f[5] = f[4];
}
function initSnow() { flakes = []; for (var i = 0; i < 10; i++) { var f = []; spawn(f); flakes.push(f); } }

function resize() {
  W = cvs.width = Math.max(1, cvs.clientWidth | 0);
  H = cvs.height = Math.max(1, cvs.clientHeight | 0);
  img = ctx.createImageData(W, H);
  buf = new Uint32Array(img.data.buffer);
}
window.addEventListener('resize', function () { resize(); initSnow(); });

// 拖动旋转
var dragX = null;
cvs.addEventListener('pointerdown', function (e) { dragX = e.clientX; cvs.setPointerCapture(e.pointerId); });
cvs.addEventListener('pointermove', function (e) {
  if (dragX === null) return;
  angle += (e.clientX - dragX) * 0.006;
  dragX = e.clientX;
});
cvs.addEventListener('pointerup', function () { dragX = null; });
cvs.addEventListener('pointercancel', function () { dragX = null; });

var angle = 0, last = 0;

function frame(now) {
  var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
  last = now;
  angle += 0.27 * dt;

  var ca = Math.cos(angle), sa = Math.sin(angle);
  var cp = Math.cos(PITCH), sp = Math.sin(PITCH);
  var F0 = H * 0.63;                    // 与 tree.py 的 HEIGHT*0.63 对齐
  var ox = W * 0.5, oy = H * 0.5;
  var i, x, y, z, xz, zz, yp, zp, sx, sy, size, bx, by, xe, ye, px, py, row, id2, p2, nr, ng, nb;
  var ci, cj, ck;

  buf.fill(0xff000000);

  for (i = 0; i < N; i++) {
    x = xs[i]; y = ys[i]; z = zs[i];
    xz = x * ca - z * sa;
    zz = x * sa + z * ca;
    yp = y * cp - zz * sp - CAM_HEIGHT;
    zp = y * sp + zz * cp + CAM_DIST;
    if (zp < 0.1) continue;
    var k2 = F0 / zp;
    sx = (ox + xz * k2) | 0;
    sy = (oy - yp * k2) | 0;
    if (sx < 0 || sx >= W || sy < 0 || sy >= H) continue;
    // tree.py 里 size 是半径，pygame 画的是 2*size 见方的圆点
    size = 3.6 - zp * 0.13;
    size = size < 1 ? 1 : (size | 0);
    bx = sx - size; by = sy - size; xe = bx + size + size; ye = by + size + size;
    if (bx < 0) bx = 0; if (by < 0) by = 0;
    if (xe > W) xe = W; if (ye > H) ye = H;
    // 取最大值混合（不是相加）：重叠不会烧成白色，保留粉色调
    ci = cr[i]; cj = cg[i]; ck = cb[i];
    for (py = by; py < ye; py++) {
      row = py * W;
      for (px = bx; px < xe; px++) {
        id2 = row + px;
        p2 = buf[id2];
        nr = p2 & 255; if (ci > nr) nr = ci;
        ng = (p2 >> 8) & 255; if (cj > ng) ng = cj;
        nb = (p2 >> 16) & 255; if (ck > nb) nb = ck;
        buf[id2] = 0xff000000 | (nb << 16) | (ng << 8) | nr;
      }
    }
  }

  // 前景大雪花：柔和光斑，靠近底部淡出
  for (i = 0; i < flakes.length; i++) {
    var fl = flakes[i];
    fl[1] += fl[3] * dt;
    fl[4] -= dt;
    if (fl[4] <= 0 || fl[1] > H + 50) spawn(fl);
    var fx = fl[0] | 0, fy = fl[1] | 0, fr2 = fl[2], phase = fl[4] / fl[5];
    var alpha = phase > 0.3 ? 255 : 255 * (phase / 0.3);
    var rr = Math.ceil(fr2), dx, dy, d, t2, xx, yy, ix2;
    for (dy = -rr; dy <= rr; dy++) {
      yy = fy + dy; if (yy < 0 || yy >= H) continue;
      for (dx = -rr; dx <= rr; dx++) {
        xx = fx + dx; if (xx < 0 || xx >= W) continue;
        d = Math.sqrt(dx * dx + dy * dy); if (d > fr2) continue;
        t2 = 1 - d / fr2; t2 = t2 * t2 * t2;
        var add2 = (alpha * t2) | 0;
        ix2 = yy * W + xx;
        p2 = buf[ix2];
        nr = (p2 & 255) + add2; ng = ((p2 >> 8) & 255) + add2; nb = ((p2 >> 16) & 255) + add2;
        buf[ix2] = 0xff000000 | ((nb > 255 ? 255 : nb) << 16) | ((ng > 255 ? 255 : ng) << 8) | (nr > 255 ? 255 : nr);
      }
    }
  }

  ctx.putImageData(img, 0, 0);
  requestAnimationFrame(frame);
}

resize();
initSnow();
build();
requestAnimationFrame(frame);
</script>
</body>
</html>
